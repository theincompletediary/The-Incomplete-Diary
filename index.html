<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Incomplete Diary</title>
<meta name="description" content="The Incomplete Diary — some stories are never finished, they simply become a part of us.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    color: #f2e6c9;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .logo {
    width: 180px;
    height: 180px;
    margin: 0 auto 28px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid #a8925f;
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  h1 {
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 18px;
  }

  .bio {
    font-size: 17px;
    font-style: italic;
    color: #cbb989;
    line-height: 1.7;
    margin-bottom: 30px;
    padding: 0 10px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: #a8925f;
    margin: 0 auto 30px;
    opacity: 0.6;
  }

  .social {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 28px;
    border: 1px solid #a8925f;
    border-radius: 30px;
    color: #f2e6c9;
    text-decoration: none;
    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 1px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .social:hover {
    background: #a8925f;
    color: #0d0d0d;
  }

  footer {
    margin-top: 50px;
    font-size: 12px;
    color: #6b5e41;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <img src="logo.svg.jpeg" alt="The Incomplete Diary logo">
    </div>

    <h1>The Incomplete Diary</h1>

    <p class="bio">"Some stories are never finished — they simply become a part of us."</p>

    <div class="divider"></div>

    <a class="social" href="https://instagram.com/theincompletediaryofficial" target="_blank" rel="noopener">
      Instagram &nbsp;·&nbsp; @theincompletediaryofficial
    </a>

    <footer>every story, unfinished</footer>
  </div>

</body>
</html>
